<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <script src="./lib/cuon-matrix-cse160.js"></script>
    <canvas id="example" width="400" height="400"> </canvas>
    <script src="asg0.js"></script>
    <div id="vector-1">
      <label for="x-coordinate-1">v1: X: </label>
      <input type="number" id="x-coordinate-1" name="x-coordinate-1" />
      <label for="y-coordinate-1">Y: </label>
      <input type="number" id="y-coordinate-1" name="y-coordinate-1" />
    </div>
    <div id="vector-1">
      <label for="x-coordinate-2">v2: X: </label>
      <input type="number" id="x-coordinate-2" name="x-coordinate-2" />
      <label for="y-coordinate-2">Y: </label>
      <input type="number" id="y-coordinate-2" name="y-coordinate-2" />
    </div>
    <button type="button" id="draw-button">Draw</button>
    <div>
      <label for="operation">Operation:</label>
      <select id="operation">
        <option value="add">Add</option>
        <option value="sub">Subtract</option>
        <option value="mul">Multiply</option>
        <option value="div">Divide</option>
        <option value="mag">Magnitude</option>
        <option value="nor">Normalize</option>
        <option value="angle-between">Angle-Between</option>
        <option value="area">Area</option>
      </select>
      <label for="scalar">Scalar: </label>
      <input id="scalar" type="number" />
      <button id="draw-button-2">Draw</button>
    </div>
  </body>
</html>
